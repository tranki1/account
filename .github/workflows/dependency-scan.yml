name: Dependency Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  # GitHub's dependency review acts on PRs and blocks known-vulnerable deps.
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # Native NuGet vulnerability audit, works on push and schedule too.
  nuget-audit:
    name: NuGet Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Account.slnx

      - name: Audit for vulnerable packages
        shell: bash
        run: |
          echo "Listing vulnerable (including transitive) packages..."
          output=$(dotnet list Account.slnx package --vulnerable --include-transitive 2>&1 || true)
          echo "$output"
          if echo "$output" | grep -Eiq "High|Critical"; then
            echo "::error::High or Critical vulnerabilities found in dependencies"
            exit 1
          fi
